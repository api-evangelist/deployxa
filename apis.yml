apis:
- name: Deployxa Platform
  description: AI-first autonomous cloud deployment platform API. The published OpenAPI 3.0.3 contract covers project
    creation and deployment execution under /api/v1 (versioned URI paths, Deprecation/Sunset headers on deprecated
    operations), with each write operation carrying an x-payment-info extension declaring a $1.00 USD Stripe charge
    per call. Authentication is dashboard API keys as bearer tokens or an OAuth 2.0 authorization-code + PKCE agent
    flow; a hosted MCP server at mcp.deployxa.com/mcp exposes an OAuth-gated tool surface scoped to projects, deployments,
    domains, logs, and billing.
