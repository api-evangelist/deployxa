name: Deployxa
description: AI-first autonomous cloud deployment platform for deploying AI-built and containerized web apps to
  production, featuring a deployment intelligence engine, global edge deployment, managed databases, VPS clusters,
  and a CLI. Publishes an OpenAPI 3.0.3 contract at /openapi.json, an llms.txt, an A2A agent card with an AP2 agentic-payments
  extension, an RFC 9727 api-catalog, OAuth 2.0 discovery metadata, and an OAuth-gated hosted MCP server at mcp.deployxa.com
  — all verified live 2026-09-05.
